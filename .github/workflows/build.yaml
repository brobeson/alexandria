# cspell:dictionaries bash

name: Build & Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  projectFiles:
    name: Project File Quality
    uses: brobeson/SupportFileQuality/.github/workflows/support_files.yaml@v1

  cpp:
    name: C++ Quality
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-26-intel]
        workflow: [debug, release]
    runs-on: ${{matrix.os}}
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: C++ Formatting
        if: ${{startsWith(matrix.os, 'ubuntu')}}
        shell: bash --noprofile --norc -O globstar -eo pipefail {0}
        # cspell:ignore Werror
        run: clang-format -Werror --dry-run --style=file **/*.[ch]pp
      - name: CMake Workflow
        env:
          CMAKE_GENERATOR: ${{!startsWith(matrix.os, 'windows') && 'Ninja' || ''}}
        run: cmake --workflow ${{matrix.workflow}}
