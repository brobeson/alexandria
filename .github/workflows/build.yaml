name: Build & Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  projectFiles:
    name: Project File Quality
    uses: brobeson/SupportFileQuality/.github/workflows/support_files.yaml@v1

  cppFiles:
    name: C++ Analysis
    runs-on: ubuntu-26.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends clang-format
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: Check clang-format
        run: |
          shopt -s globstar
          clang-format --version
          # clang-format --style=LLVM --dump-config
          # clang-format-20 -Werror --dry-run --style=file **/*.[ch]pp
