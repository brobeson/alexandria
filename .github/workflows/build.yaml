# cspell:dictionaries bash

name: Build & Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  projectFiles:
    name: Project File Quality
    uses: brobeson/SupportFileQuality/.github/workflows/support_files.yaml@v1

  cpp:
    name: C++ Quality
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-26-intel]
        workflow: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: CMake Workflow
        env:
          CMAKE_GENERATOR: ${{ !startsWith(matrix.os, 'windows') && 'Ninja' || '' }}
          CXX: ${{ startsWith(matrix.os, 'ubuntu') && 'clang++' || '' }}
          CC: ${{ startsWith(matrix.os, 'ubuntu') && 'clang' || '' }}
        run: cmake --workflow ${{ matrix.workflow }}
      - run: cat build/${{ matrix.workflow }}/compile_commands.json
      - name: Install Cppcheck
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: sudo apt-get install cppcheck
      - name: Run Cppcheck
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: cppcheck --project=build/${{ matrix.workflow}}/compile_commands.json --enable=all
